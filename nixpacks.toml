[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "composer dump-autoload --optimize --no-dev",
  "npm ci --include=dev"
]

[phases.build]
cmds = [
  "node node_modules/vite/bin/vite.js build"
]

[start]
cmd = "bash railway-start.sh"
