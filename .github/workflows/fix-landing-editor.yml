name: Retire conflicting landing editor patch

# Kept as a documented no-op so the old automatic layout patch no longer
# overwrites the standalone card design maintained by landing-panels-once.yml.

on:
  push:
    branches:
      - refactor-fokus-laporan

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "Legacy landing editor layout patch retired."
