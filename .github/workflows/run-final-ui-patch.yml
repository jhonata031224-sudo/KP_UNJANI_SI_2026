name: Run Final UI Patch
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/refactor-fokus-laporan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/final_ui_patch.py
      - run: |
          grep -Fq 'width:220px!important' resources/views/siberad/dashboards/partials/admin-ui-consistency.blade.php
          grep -Fq 'backup-upload-form{display:none!important}' resources/views/siberad/dashboards/partials/admin-ui-consistency.blade.php
      - name: Commit patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/siberad/dashboards/partials/admin-ui-consistency.blade.php
          git rm tools/final_ui_patch.py .github/workflows/run-final-ui-patch.yml
          git diff --cached --check
          git commit -m "fix(admin): finalize role actions and backup upload spacing"
          git push
