name: Normalize laporan sidebar

on:
  push:
    branches:
      - refactor-fokus-laporan

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor-fokus-laporan
          fetch-depth: 0

      - name: Normalize report dropdowns
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('resources/views/siberad/dashboards')
          changed = []

          for path in root.glob('*.blade.php'):
              text = path.read_text(encoding='utf-8')
              original = text

              # Standardize the report dropdown title.
              text = re.sub(
                  r'(<div class="side-dropdown" id="laporanDropdown">.*?'
                  r'<span class="side-link-label">)(.*?)(</span>)',
                  r'\1Laporan\3', text, count=1, flags=re.S
              )

              # Keep the report menu focused on the agreed three actions.
              text = re.sub(
                  r'\s*<a[^>]*class="side-link side-sublink"[^>]*data-tab-link="[^"]*draft[^"]*"[^>]*>.*?</a>',
                  '', text, flags=re.S | re.I
              )

              # Rename the first report submenu item without changing its route/tab target.
              text = re.sub(
                  r'(<div class="side-dropdown-menu" id="laporanSubmenu">\s*'
                  r'<a[^>]*class="side-link side-sublink"[^>]*>)(.*?)(</a>)',
                  r'\1Tambah Laporan\3', text, count=1, flags=re.S
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(item)

      - name: Commit normalized sidebars
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/siberad/dashboards/*.blade.php .github/workflows/normalize-laporan-dropdown.yml
          git rm -f .github/workflows/normalize-laporan-dropdown.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Standardize laporan dropdowns [skip ci]"
          git push origin refactor-fokus-laporan
