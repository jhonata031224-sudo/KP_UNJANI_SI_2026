name: Make landing editor sections standalone

on:
  push:
    branches:
      - refactor-fokus-laporan

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor-fokus-laporan
          fetch-depth: 0

      - name: Patch landing editor sections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/js/admin-landing-editor.js')
          text = path.read_text(encoding='utf-8')

          start = text.index('  function addCard(')
          end = text.index('  function addLogoField(', start)
          new_add_card = r'''  function addCard(panel, title, fields, desc = '') {
    const standalone = panel && panel.classList.contains('lp-managed-panels');
    const card = document.createElement('div');
    card.className = standalone ? 'panel lp-panel lp-managed-section' : 'lp-card';

    if (standalone) {
      const head = document.createElement('div');
      head.className = 'panel-head';
      const inner = document.createElement('div');
      const h = document.createElement('h3');
      h.textContent = title;
      inner.appendChild(h);
      if (desc) {
        const p = document.createElement('p');
        p.textContent = desc;
        inner.appendChild(p);
      }
      head.appendChild(inner);
      card.appendChild(head);
    } else {
      const t = document.createElement('div');
      t.className = 'lp-card-title';
      t.textContent = title;
      card.appendChild(t);

      if (desc) {
        const p = document.createElement('p');
        p.className = 'lp-card-desc';
        p.textContent = desc;
        card.appendChild(p);
      }
    }

    const grid = document.createElement('div');
    grid.className = 'form-grid';
    fields.forEach(f => {
      // tuple: [path, label, type, extraOpts, defaultValue]
      addField(grid, f[1], f[0], get(config, f[0], f[4] ?? ''), f[2] || 'text', f[3] || {});
    });
    card.appendChild(grid);

    panel.appendChild(card);
    return card;
  }

'''
          text = text[:start] + new_add_card + text[end:]

          start = text.index('  function addCardHtml(')
          end = text.index('  function styleFilePickers(', start)
          new_add_card_html = r'''  function addCardHtml(panel, headHtml) {
    const standalone = panel && panel.classList.contains('lp-managed-panels');
    const card = document.createElement('div');

    if (standalone) {
      card.className = 'panel lp-panel lp-managed-section';
      const head = document.createElement('div');
      head.className = 'panel-head';
      const inner = document.createElement('div');
      inner.innerHTML = headHtml;
      head.appendChild(inner);
      card.appendChild(head);
    } else {
      card.className = 'lp-card lp-card-compact';
      card.innerHTML = headHtml;
    }

    panel.appendChild(card);
    return card;
  }

'''
          text = text[:start] + new_add_card_html + text[end:]

          # Inject a dedicated card visual system into the landing editor.
          # This is presentation-only: existing field names, event handlers,
          # tabs, save logic, upload logic, and preview bindings are untouched.
          if 'function applyLandingCardDesign()' not in text:
              marker = '  function styleFilePickers() {'
              card_styles = r'''  function applyLandingCardDesign() {
    if (document.getElementById('landing-card-design-style')) return;

    const style = document.createElement('style');
    style.id = 'landing-card-design-style';
    style.textContent = `
      /* ===== LANDING EDITOR — CARD DESIGN ===== */
      .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels){
        background:var(--panel,#fff);
        border:1px solid var(--border-soft,#e2e8f0);
        border-radius:16px;
        box-shadow:0 5px 18px rgba(15,23,42,.055);
        overflow:hidden;
        margin:0 0 16px;
      }

      .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) .panel-head{
        padding:18px 20px 15px;
        border-bottom:1px solid var(--border-soft,#e2e8f0);
        background:linear-gradient(180deg,rgba(248,250,252,.96),rgba(255,255,255,.98));
        position:relative;
      }

      .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) .panel-head::before,
      .lp-managed-section .panel-head::before{
        content:"";
        position:absolute;
        left:0;
        top:0;
        bottom:0;
        width:4px;
        background:var(--gold,#ff9800);
        border-radius:16px 0 0 16px;
      }

      .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) .panel-head h3,
      .lp-managed-section .panel-head h3{
        margin:0;
        font-family:var(--display,inherit);
        font-size:15px;
        line-height:1.35;
        font-weight:750;
        letter-spacing:-.01em;
        color:var(--text,#17212b);
      }

      .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) .panel-head p,
      .lp-managed-section .panel-head p{
        margin:5px 0 0;
        max-width:780px;
        font-size:11.5px;
        line-height:1.55;
        color:var(--text-muted,#64748b);
      }

      .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) > .form-grid,
      .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) > .lp-card,
      .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) > .lp-tab-desc{
        margin-left:20px;
        margin-right:20px;
      }

      .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) > .form-grid{
        padding:18px 0 20px;
      }

      .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) > .lp-tab-desc{
        padding:16px 0 18px;
        margin-bottom:0;
      }

      /* Dynamic sections such as Identitas Brand, Tombol Hero, Navigasi,
         Statistik, Login, Loading, Footer, etc. are arranged as a clean
         two-column card grid. The host itself is transparent so it never
         looks like a card containing cards. */
      .lp-layout > form .lp-managed-panels{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:16px;
        width:100%;
        background:transparent;
        border:0;
        border-radius:0;
        box-shadow:none;
        padding:0;
        margin:0 0 16px;
        overflow:visible;
      }

      .lp-layout > form .lp-managed-panels:not(.active){
        display:none;
      }

      .lp-layout > form .lp-managed-section{
        min-width:0;
        margin:0;
        padding:0;
        background:var(--panel,#fff);
        border:1px solid var(--border-soft,#e2e8f0);
        border-radius:16px;
        box-shadow:0 5px 18px rgba(15,23,42,.055);
        overflow:hidden;
        transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
      }

      .lp-layout > form .lp-managed-section:hover{
        border-color:var(--border-strong,#cbd5e1);
        box-shadow:0 8px 24px rgba(15,23,42,.075);
        transform:translateY(-1px);
      }

      .lp-layout > form .lp-managed-section .panel-head{
        position:relative;
        min-height:78px;
        box-sizing:border-box;
        padding:17px 18px 14px 20px;
        border-bottom:1px solid var(--border-soft,#e2e8f0);
        background:linear-gradient(180deg,rgba(248,250,252,.96),rgba(255,255,255,.98));
      }

      .lp-layout > form .lp-managed-section > .form-grid{
        padding:17px 18px 19px;
        box-sizing:border-box;
      }

      /* Tampilkan kelompok field berulang tetap rapi di dalam card. */
      .lp-layout > form .lp-managed-section .form-grid{
        min-width:0;
      }

      .lp-layout > form .lp-managed-section input,
      .lp-layout > form .lp-managed-section textarea,
      .lp-layout > form .lp-managed-section select{
        min-width:0;
        max-width:100%;
        box-sizing:border-box;
      }

      .lp-layout > form .lp-managed-section .form-field{
        min-width:0;
      }

      /* Card statis yang memang sudah memakai .lp-card tetap ringan dan
         tidak berubah menjadi card bersarang. */
      .lp-layout > form .lp-panel .lp-card{
        border-color:var(--border-soft,#e2e8f0);
        background:var(--panel-alt,#f8fafc);
        border-radius:12px;
      }

      @media(max-width:900px){
        .lp-layout > form .lp-managed-panels{
          grid-template-columns:1fr;
        }
      }

      @media(max-width:640px){
        .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels){
          border-radius:13px;
          margin-bottom:13px;
        }
        .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) .panel-head{
          padding:16px 16px 14px;
        }
        .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) > .form-grid,
        .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) > .lp-card,
        .lp-layout > form > .lp-panel.lp-tab-panel:not(.lp-managed-panels) > .lp-tab-desc{
          margin-left:16px;
          margin-right:16px;
        }
        .lp-layout > form .lp-managed-section{
          border-radius:13px;
        }
        .lp-layout > form .lp-managed-section .panel-head{
          padding:16px 16px 14px 18px;
        }
        .lp-layout > form .lp-managed-section > .form-grid{
          padding:16px 16px 17px;
        }
      }
    `;
    document.head.appendChild(style);
  }

'''
              text = text.replace(marker, card_styles + marker, 1)

          # Apply the visual layer when the editor is built. No data/behavior
          # is modified by this call.
          text = text.replace('    styleFilePickers();', '    applyLandingCardDesign();\n    styleFilePickers();', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/admin-landing-editor.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix landing editor standalone section panels"
          git push origin HEAD:refactor-fokus-laporan
