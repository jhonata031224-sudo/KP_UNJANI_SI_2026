name: One-time landing preview resize

on:
  push:
    branches:
      - refactor-fokus-laporan

permissions:
  contents: write

jobs:
  resize-preview:
    if: contains(github.event.head_commit.message, '[apply-preview-resize]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-fokus-laporan
          fetch-depth: 0

      - name: Apply scoped preview sizing
        shell: python
        run: |
          from pathlib import Path

          path = Path('resources/views/siberad/dashboards/admin.blade.php')
          workflow = Path('.github/workflows/one-time-preview-resize.yml')
          text = path.read_text(encoding='utf-8')

          anchor = '''          .lp-preview-body{padding:0 22px 22px;}\n\n          .lp-browser-frame{border-radius:12px;overflow:hidden;border:1px solid var(--border-soft);box-shadow:0 14px 34px -14px rgba(0,0,0,.4);}\n'''

          replacement = '''          .lp-preview-body{padding:0 22px 22px;}\n\n          /* Preview dibuat seperti viewport desktop mini agar landing page utuh\n             terlihat di dalam kartu Admin tanpa memperbesar panel. */\n          .lp-browser-frame{\n            border-radius:12px;overflow:hidden;border:1px solid var(--border-soft);\n            box-shadow:0 14px 34px -14px rgba(0,0,0,.4);\n            background:var(--bg);\n          }\n          .lp-preview{\n            zoom:.72;\n            width:138.8889%;\n          }\n          @media (max-width:1280px){\n            .lp-preview{zoom:.64;width:156.25%;}\n          }\n          @media (max-width:1100px){\n            .lp-preview{zoom:.78;width:128.2051%;}\n          }\n'''

          if anchor not in text:
              raise SystemExit('Target CSS anchor not found; file left unchanged.')
          if '/* Preview dibuat seperti viewport desktop mini' in text:
              raise SystemExit('Resize CSS already applied; nothing to do.')

          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          if workflow.exists():
              workflow.unlink()

      - name: Commit landing preview resize
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/siberad/dashboards/admin.blade.php .github/workflows/one-time-preview-resize.yml
          git commit -m 'fix(admin): scale landing preview to fit panel'
          git push origin refactor-fokus-laporan
