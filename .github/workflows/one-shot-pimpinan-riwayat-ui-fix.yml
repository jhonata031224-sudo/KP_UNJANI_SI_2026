name: One-shot Pimpinan Riwayat UI Fix

on:
  push:
    branches:
      - refactor-fokus-laporan

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(ui): samakan popup Riwayat Aktivitas Pimpinan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped CSS patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('resources/views/siberad/dashboards/laporan-pimpinan.blade.php')
          text = path.read_text(encoding='utf-8')

          old = '''@media(min-width:901px){
.sidebar.collapsed .side-nav-group.open .side-subnav>div{border-left:none;margin-left:0;padding:0;}
.sidebar.collapsed .side-sub-link{padding:9px 10px;border-radius:8px;}
}'''

          new = '''@media(min-width:901px){
.sidebar.collapsed .side-nav-group.open .side-subnav>div{border-left:none;margin-left:0;padding:0;}
.sidebar.collapsed .side-sub-link{padding:9px 10px;border-radius:8px;}

/* Khusus popup Riwayat Aktivitas Pimpinan saat sidebar ciutkan:
   samakan style item submenu dengan submenu saat sidebar terbuka.
   Selector sengaja dibatasi ke #monitorGroup agar Pelaporan, Surat,
   dan Kendala Kasansi tidak ikut berubah. */
.sidebar.collapsed #monitorGroup.open .side-subnav>div{gap:2px!important;}
.sidebar.collapsed #monitorGroup.open .side-sub-link{
  gap:10px!important;
  padding:9px 12px 9px 17px!important;
  border-radius:0 9px 9px 0!important;
  color:var(--text-muted)!important;
  font-family:var(--body)!important;
  font-size:13px!important;
  font-weight:500!important;
  line-height:1.4!important;
  text-decoration:none!important;
}
.sidebar.collapsed #monitorGroup.open .side-sub-link:hover{
  background:var(--hover-tint)!important;
  color:var(--text)!important;
}
.sidebar.collapsed #monitorGroup.open .side-sub-link.active{
  background:var(--gold-dim,rgba(201,122,0,.1))!important;
  color:var(--p-accent)!important;
  font-weight:600!important;
}
.sidebar.collapsed #monitorGroup.open .side-sub-link.active:before{
  left:-1px;
  top:8px;
  bottom:8px;
  width:2px;
  border-radius:2px;
  background:var(--p-accent);
}
.sidebar.collapsed #monitorGroup.open .side-sub-link .sub-dot{
  width:5px;
  height:5px;
  border-radius:50%;
  opacity:.5;
  background:currentColor;
}
.sidebar.collapsed #monitorGroup.open .side-sub-link.active .sub-dot{
  background:var(--p-accent)!important;
  opacity:1!important;
  box-shadow:0 0 0 3px rgba(201,122,0,.15)!important;
}
}'''

          if old not in text:
              raise SystemExit('Target CSS block tidak ditemukan; patch dibatalkan tanpa menyentuh file.')

          if '#monitorGroup.open .side-sub-link' in text:
              raise SystemExit('Patch Riwayat Aktivitas sudah ada; tidak melakukan perubahan tambahan.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit only target UI change and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/siberad/dashboards/laporan-pimpinan.blade.php
          git rm .github/workflows/one-shot-pimpinan-riwayat-ui-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): samakan popup Riwayat Aktivitas Pimpinan"
          git push origin HEAD:refactor-fokus-laporan
