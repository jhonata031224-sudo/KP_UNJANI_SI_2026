name: Temporary fix DANPUS report buttons

on:
  push:
    branches:
      - refactor-fokus-laporan

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: rapikan tombol detail laporan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply button UI fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('resources/views/siberad/dashboards/danpus.blade.php')
          text = path.read_text(encoding='utf-8')

          css_pattern = r'''  <style>\n    \.detail-grid\{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;\}\n    \.detail-item\{display:flex;flex-direction:column;gap:4px;\}\n    \.detail-item\.full\{grid-column:1 / -1;\}\n    \.detail-label\{font-family:var\(--mono\);font-size:10\.5px;letter-spacing:\.06em;text-transform:uppercase;color:var\(--text-dim\);\}\n  </style>'''

          css_replacement = '''  <style>
            .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;}
            .detail-item{display:flex;flex-direction:column;gap:4px;}
            .detail-item.full{grid-column:1 / -1;}
            .detail-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);}

            /* Tombol aksi Detail Laporan DANPUS dibuat seragam. */
            #detailAksi{
              display:flex;
              align-items:center;
              justify-content:flex-end;
              gap:10px;
              flex-wrap:wrap;
            }
            #detailAksi .btn{
              display:inline-flex;
              align-items:center;
              justify-content:center;
              min-width:110px;
              height:40px;
              padding:0 16px;
              margin:0;
              box-sizing:border-box;
              border-radius:8px;
              line-height:1;
              white-space:nowrap;
            }
            #detailAksi .btn-ghost-red{
              border:1px solid var(--red);
              background:var(--red-dim);
              color:var(--red);
            }
            #detailAksi .btn-ghost-red:hover{
              background:var(--red);
              color:#fff;
            }
          </style>'''

          text, css_count = re.subn(css_pattern, css_replacement, text, count=1)
          if css_count != 1:
              raise SystemExit('CSS target tidak ditemukan; file tidak diubah.')

          js_pattern = r'''      if\(l\.status === 'Menunggu'\)\{\n        aksiWrap\.innerHTML =\n          '<button type="button" class="btn btn-ghost-red" onclick="tutupDetailLaporan\(\); bukaKonfirmasiLaporan\(' \+ index \+ ", 'tolak', '" \+ satuanEsc \+ "', '" \+ perihalEsc \+ "'\)\\">Tolak Laporan</button>" \+\n          '<button type="button" class="btn btn-primary" onclick="tutupDetailLaporan\(\); bukaKonfirmasiLaporan\(' \+ index \+ ", 'setuju', '" \+ satuanEsc \+ "', '" \+ perihalEsc \+ "'\)\\">Setujui Laporan</button>';\n      \} else \{'''

          js_replacement = '''      if(l.status === 'Menunggu'){
        aksiWrap.innerHTML =
          '<button type="button" class="btn btn-primary" onclick="tutupDetailLaporan(); bukaKonfirmasiLaporan(' + index + ", 'setuju', '" + satuanEsc + "', '" + perihalEsc + "')\\">Terima</button>" +
          '<button type="button" class="btn btn-ghost-red" onclick="tutupDetailLaporan(); bukaKonfirmasiLaporan(' + index + ", 'tolak', '" + satuanEsc + "', '" + perihalEsc + "')\\">Tolak</button>";
      } else {'''

          text, js_count = re.subn(js_pattern, js_replacement, text, count=1)
          if js_count != 1:
              raise SystemExit('JavaScript target tidak ditemukan; file tidak diubah.')

          path.write_text(text, encoding='utf-8')
          print('DANPUS button fix applied successfully.')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_fix_danpus_buttons.yml
          git add resources/views/siberad/dashboards/danpus.blade.php
          git diff --cached --check
          git diff --cached -- resources/views/siberad/dashboards/danpus.blade.php
          git commit -m "fix: rapikan tombol detail laporan"
          git push