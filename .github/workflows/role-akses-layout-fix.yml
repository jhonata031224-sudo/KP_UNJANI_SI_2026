name: Scoped Role Access Layout Fix

on:
  push:
    branches:
      - refactor-fokus-laporan

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Role & Hak Akses table fit without horizontal scroll
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('resources/views/siberad/dashboards/admin.blade.php')
          text = path.read_text(encoding='utf-8')
          start_marker = '        {{-- ===== ROLE & HAK AKSES ===== }}'
          end_marker = '      {{-- ===== LOG AKTIVITAS ===== }}'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Role & Hak Akses markers not found')

          replacement = '''        {{-- ===== ROLE & HAK AKSES ===== }}
      <section class="tab-panel" data-tab-panel="role-akses">
        <div class="section-head panel">
          <h2>Role &amp; Hak Akses</h2>
          <p>Setiap satuan berperan sebagai role login. Atur modul apa saja yang boleh diakses tiap satuan.</p>
        </div>

        @if (session('status'))
          <div class="notice">{{ session('status') }}</div>
        @endif

        <div class="panel role-akses-table-panel">
          <div class="panel-head">
            <div>
              <h3>Daftar Role &amp; Hak Akses</h3>
              <p>Semua role ditampilkan dalam satu tabel agar ringkas dan tetap mudah dibaca.</p>
            </div>
          </div>
          <div class="tbl-wrap role-akses-table-wrap">
            <table class="dtbl role-akses-table">
              <colgroup>
                <col class="role-col">
                <col class="desc-col">
                <col class="access-col">
                <col class="action-col">
              </colgroup>
              <thead><tr><th>Role / Satuan</th><th>Deskripsi</th><th>Hak Akses Modul</th><th class="role-akses-action-head">Aksi</th></tr></thead>
              <tbody>
                @foreach($semuaSatuan as $s)
                @php($permissionFormId = 'permissionForm' . $s->id)
                <tr>
                  <td><div class="role-akses-name">{{ $s->nama }}</div><span class="badge role-akses-code">{{ $s->kode }}</span></td>
                  <td class="role-akses-description">{{ $s->deskripsi ?: 'Tidak ada deskripsi.' }}</td>
                  <td>
                    <form id="{{ $permissionFormId }}" method="POST" action="{{ route('admin.satuan.permissions', $s) }}">
                      @csrf @method('PATCH')
                      <div class="role-akses-checks">
                        @foreach($modulHakAkses as $key => $label)
                        <label class="role-akses-check"><input type="checkbox" name="permissions[]" value="{{ $key }}" @checked(in_array($key, $s->permissions ?? []))><span>{{ $label }}</span></label>
                        @endforeach
                      </div>
                    </form>
                  </td>
                  <td class="role-akses-action"><button class="btn btn-primary btn-sm role-akses-save" type="submit" form="{{ $permissionFormId }}">Simpan</button></td>
                </tr>
                @endforeach
              </tbody>
            </table>
          </div>
        </div>
        <style>
          .role-akses-table-panel{overflow:hidden}
          .role-akses-table-wrap{overflow-x:hidden;width:100%}
          .role-akses-table{width:100%;min-width:0;table-layout:fixed}
          .role-akses-table .role-col{width:20%}
          .role-akses-table .desc-col{width:27%}
          .role-akses-table .access-col{width:41%}
          .role-akses-table .action-col{width:12%}
          .role-akses-table th,.role-akses-table td{box-sizing:border-box}
          .role-akses-table th{white-space:nowrap}
          .role-akses-name{font-weight:700;color:var(--text);margin-bottom:7px;line-height:1.3;overflow-wrap:anywhere}
          .role-akses-code{font-size:9.5px;padding:5px 9px}
          .role-akses-description{color:var(--text-muted);line-height:1.55;overflow-wrap:anywhere}
          .role-akses-checks{display:flex;flex-direction:column;align-items:flex-start;gap:9px}
          .role-akses-check{display:flex;align-items:flex-start;gap:7px;width:100%;color:var(--text-muted);font-size:12px;line-height:1.4;cursor:pointer;white-space:normal}
          .role-akses-check input{margin:2px 0 0;flex:0 0 auto;accent-color:var(--gold-bright)}
          .role-akses-check span{overflow-wrap:anywhere}
          .role-akses-check:hover{color:var(--text)}
          .role-akses-action-head,.role-akses-action{text-align:center!important;vertical-align:middle}
          .role-akses-save{white-space:nowrap;padding-left:9px;padding-right:9px}
          @media(max-width:760px){
            .role-akses-table{font-size:11px}
            .role-akses-table .role-col{width:21%}
            .role-akses-table .desc-col{width:25%}
            .role-akses-table .access-col{width:42%}
            .role-akses-table .action-col{width:12%}
            .role-akses-table th,.role-akses-table td{padding:9px 7px}
            .role-akses-save{font-size:10px;padding-left:7px;padding-right:7px}
          }
        </style>
      </section>

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          print('Role & Hak Akses table compacted to fit the panel width.')
          PY

      - name: Verify and remove helper workflow
        run: |
          grep -q 'role-akses-table{width:100%;min-width:0;table-layout:fixed}' resources/views/siberad/dashboards/admin.blade.php
          grep -q 'role-akses-checks{display:flex;flex-direction:column' resources/views/siberad/dashboards/admin.blade.php
          rm -f .github/workflows/role-akses-layout-fix.yml

      - name: Commit scoped change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/siberad/dashboards/admin.blade.php .github/workflows/role-akses-layout-fix.yml
          git diff --cached --check
          git commit -m "fix: rapikan tabel role dan hak akses tanpa scroll horizontal"
          git push
