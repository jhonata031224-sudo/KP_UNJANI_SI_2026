name: Temporary DANPUS report button fix v2

on:
  push:
    branches:
      - refactor-fokus-laporan

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('resources/views/siberad/dashboards/danpus.blade.php')
          text = path.read_text(encoding='utf-8')

          marker = '#detailAksi .btn{'
          if marker not in text:
              css = '''\n    /* Tombol aksi Detail Laporan DANPUS */\n    #detailAksi{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;}\n    #detailAksi .btn{display:inline-flex;align-items:center;justify-content:center;min-width:110px;height:40px;padding:0 16px;margin:0;box-sizing:border-box;border-radius:8px;line-height:1;white-space:nowrap;}\n    #detailAksi .btn-ghost-red{border:1px solid var(--red);background:var(--red-dim);color:var(--red);}\n    #detailAksi .btn-ghost-red:hover{background:var(--red);color:#fff;}\n'''
              anchor = '    .detail-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);}\n'
              if anchor not in text:
                  raise SystemExit('CSS anchor tidak ditemukan.')
              text = text.replace(anchor, anchor + css, 1)

          js_pattern = re.compile(r"      if\(l\.status === 'Menunggu'\)\{.*?      \} else \{", re.S)
          js_replacement = '''      if(l.status === 'Menunggu'){
        aksiWrap.innerHTML =
          '<button type="button" class="btn btn-primary" onclick="tutupDetailLaporan(); bukaKonfirmasiLaporan(' + index + ", 'setuju', '" + satuanEsc + "', '" + perihalEsc + "')\\">Terima</button>" +
          '<button type="button" class="btn btn-ghost-red" onclick="tutupDetailLaporan(); bukaKonfirmasiLaporan(' + index + ", 'tolak', '" + satuanEsc + "', '" + perihalEsc + "')\\">Tolak</button>";
      } else {'''
          text, count = js_pattern.subn(js_replacement, text, count=1)
          if count != 1:
              raise SystemExit('JavaScript target tidak ditemukan.')

          path.write_text(text, encoding='utf-8')
          print('DANPUS button fix applied.')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -n "#detailAksi .btn" resources/views/siberad/dashboards/danpus.blade.php
          grep -n "">Terima</button>" resources/views/siberad/dashboards/danpus.blade.php
          grep -n "">Tolak</button>" resources/views/siberad/dashboards/danpus.blade.php
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_fix_danpus_buttons.yml .github/workflows/_tmp_fix_danpus_buttons_v2.yml
          git add resources/views/siberad/dashboards/danpus.blade.php
          git diff --cached --check
          git commit -m "fix: rapikan tombol detail laporan"
          git push