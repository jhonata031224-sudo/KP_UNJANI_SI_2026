name: Fix Pimpinan Submenu

on:
  push:
    branches:
      - refactor-fokus-laporan

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor-fokus-laporan
          fetch-depth: 0

      - name: Patch submenu CSS
        shell: python
        run: |
          from pathlib import Path

          path = Path('resources/views/siberad/dashboards/laporan-pimpinan.blade.php')
          text = path.read_text(encoding='utf-8')

          marker = '/* FINAL: samakan flyout Riwayat Aktivitas dengan submenu saat sidebar terbuka */'
          if marker not in text:
              patch = r'''
<style>
/* FINAL: samakan flyout Riwayat Aktivitas dengan submenu saat sidebar terbuka */
@media (min-width:901px){
  .sidebar.collapsed #monitorGroup.open .side-subnav{
    width:265px!important;
    min-width:265px!important;
    padding:8px!important;
    border-radius:12px!important;
  }
  .sidebar.collapsed #monitorGroup.open .side-subnav>div{
    width:100%!important;
    max-height:calc(min(420px,calc(100vh - 80px)) - 16px)!important;
    margin-left:0!important;
    padding:3px 0!important;
    border-left:1px solid var(--p-border,var(--border-soft))!important;
    gap:10px!important;
    overflow-y:auto!important;
    overflow-x:hidden!important;
    scrollbar-width:thin;
    scrollbar-color:var(--p-muted) transparent;
  }
  .sidebar.collapsed #monitorGroup.open .side-subnav-label{
    display:block!important;
    font-family:var(--mono)!important;
    font-size:10px!important;
    letter-spacing:.08em!important;
    text-transform:uppercase!important;
    color:var(--p-muted)!important;
    padding:4px 10px 8px!important;
  }
  .sidebar.collapsed #monitorGroup.open .side-sub-link{
    position:relative!important;
    display:flex!important;
    align-items:center!important;
    gap:10px!important;
    width:100%!important;
    min-height:0!important;
    margin:0!important;
    padding:9px 12px 9px 17px!important;
    border-radius:0 9px 9px 0!important;
    color:var(--text-muted)!important;
    background:transparent!important;
    font-family:var(--body)!important;
    font-size:13.5px!important;
    font-weight:500!important;
    line-height:1.4!important;
    text-decoration:none!important;
    box-sizing:border-box!important;
  }
  .sidebar.collapsed #monitorGroup.open .side-sub-link:hover{
    background:var(--hover-tint)!important;
    color:var(--text)!important;
  }
  .sidebar.collapsed #monitorGroup.open .side-sub-link.active{
    background:var(--gold-dim,rgba(201,122,0,.1))!important;
    color:var(--p-accent)!important;
    font-weight:600!important;
    box-shadow:inset 2px 0 0 var(--p-accent)!important;
  }
  .sidebar.collapsed #monitorGroup.open .side-sub-link.active:before{
    display:none!important;
  }
  .sidebar.collapsed #monitorGroup.open .side-sub-link .sub-dot{
    flex:0 0 auto!important;
    width:5px!important;
    height:5px!important;
    margin-top:0!important;
    border-radius:50%!important;
    opacity:.5!important;
    background:currentColor!important;
  }
  .sidebar.collapsed #monitorGroup.open .side-sub-link.active .sub-dot{
    background:var(--p-accent)!important;
    opacity:1!important;
    box-shadow:0 0 0 3px rgba(201,122,0,.15)!important;
  }
  .sidebar.collapsed #monitorGroup.open .side-subnav>div::-webkit-scrollbar{width:8px!important}
  .sidebar.collapsed #monitorGroup.open .side-subnav>div::-webkit-scrollbar-thumb{
    background:var(--p-muted,var(--border-soft))!important;
    border-radius:99px!important;
    border:2px solid var(--p-surface)!important;
    background-clip:padding-box!important;
  }
  .sidebar.collapsed #monitorGroup.open .side-subnav>div::-webkit-scrollbar-track{
    background:var(--hover-tint,rgba(0,0,0,.05))!important;
    border-radius:99px!important;
    margin:4px 2px!important;
  }
}
</style>
'''
              idx = text.rfind('</head>')
              if idx == -1:
                  raise SystemExit('HEAD_NOT_FOUND')
              text = text[:idx] + patch + text[idx:]
              path.write_text(text, encoding='utf-8')
          else:
              print('Patch already present')

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/siberad/dashboards/laporan-pimpinan.blade.php
          git rm -f .github/workflows/fix-pimpinan-submenu.yml
          git commit -m "fix: samakan flyout riwayat aktivitas dengan submenu terbuka" || exit 0
          git push origin HEAD:refactor-fokus-laporan

# trigger revision 3
