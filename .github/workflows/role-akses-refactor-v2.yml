name: Scoped Role Access Refactor v2

on:
  push:
    branches:
      - refactor-fokus-laporan

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refactor only Role & Hak Akses section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('resources/views/siberad/dashboards/admin.blade.php')
          text = path.read_text(encoding='utf-8')
          start_marker = '        {{-- ===== ROLE & HAK AKSES ===== }}'
          end_marker = '      {{-- ===== LOG AKTIVITAS ===== }}'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Role & Hak Akses markers not found')
          replacement = '''        {{-- ===== ROLE & HAK AKSES ===== }}
      <section class="tab-panel" data-tab-panel="role-akses">
        <div class="section-head panel">
          <h2>Role &amp; Hak Akses</h2>
          <p>Setiap satuan berperan sebagai role login. Atur modul apa saja yang boleh diakses tiap satuan.</p>
        </div>

        @if (session('status'))
          <div class="notice">{{ session('status') }}</div>
        @endif

        <div class="panel role-akses-table-panel">
          <div class="panel-head">
            <div>
              <h3>Daftar Role &amp; Hak Akses</h3>
              <p>Semua role ditampilkan dalam satu tabel agar lebih ringkas, dengan deskripsi dan pengaturan akses tetap terpisah untuk tiap satuan.</p>
            </div>
          </div>
          <div class="tbl-wrap role-akses-table-wrap">
            <table class="dtbl role-akses-table">
              <thead><tr><th style="min-width:190px;">Role / Satuan</th><th style="min-width:230px;">Deskripsi</th><th style="min-width:420px;">Hak Akses</th><th style="width:120px;text-align:center;">Aksi</th></tr></thead>
              <tbody>
                @foreach($semuaSatuan as $s)
                @php($permissionFormId = 'permissionForm' . $s->id)
                <tr>
                  <td><div class="role-akses-name">{{ $s->nama }}</div><span class="badge role-akses-code">{{ $s->kode }}</span></td>
                  <td class="role-akses-description">{{ $s->deskripsi ?: 'Tidak ada deskripsi.' }}</td>
                  <td>
                    <form id="{{ $permissionFormId }}" method="POST" action="{{ route('admin.satuan.permissions', $s) }}">
                      @csrf @method('PATCH')
                      <div class="role-akses-checks">
                        @foreach($modulHakAkses as $key => $label)
                        <label class="role-akses-check"><input type="checkbox" name="permissions[]" value="{{ $key }}" @checked(in_array($key, $s->permissions ?? []))><span>{{ $label }}</span></label>
                        @endforeach
                      </div>
                    </form>
                  </td>
                  <td style="text-align:center;"><button class="btn btn-primary btn-sm role-akses-save" type="submit" form="{{ $permissionFormId }}">Simpan</button></td>
                </tr>
                @endforeach
              </tbody>
            </table>
          </div>
        </div>
        <style>
          .role-akses-table-panel{overflow:hidden}.role-akses-table-wrap{overflow-x:auto}.role-akses-table{min-width:980px}.role-akses-table th{white-space:nowrap}.role-akses-name{font-weight:700;color:var(--text);margin-bottom:7px;line-height:1.3}.role-akses-code{font-size:9.5px;padding:5px 9px}.role-akses-description{color:var(--text-muted);line-height:1.55;max-width:280px}.role-akses-checks{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}.role-akses-check{display:inline-flex;align-items:center;gap:7px;color:var(--text-muted);font-size:12px;line-height:1.4;cursor:pointer;white-space:nowrap}.role-akses-check input{margin:0;accent-color:var(--gold-bright)}.role-akses-check:hover{color:var(--text)}.role-akses-save{white-space:nowrap}@media(max-width:980px){.role-akses-table{min-width:900px}.role-akses-checks{max-width:470px}}
        </style>
      </section>

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          print('Role & Hak Akses section refactored.')
          PY

      - name: Verify Blade markers and remove helper files
        run: |
          grep -q 'role-akses-table' resources/views/siberad/dashboards/admin.blade.php
          grep -q 'data-tab-panel="role-akses"' resources/views/siberad/dashboards/admin.blade.php
          rm -f .github/workflows/role-akses-refactor-v2.yml .github/role-akses-refactor-trigger.txt

      - name: Commit scoped change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/siberad/dashboards/admin.blade.php .github/workflows/role-akses-refactor-v2.yml .github/role-akses-refactor-trigger.txt
          git diff --cached --check
          git commit -m "refactor: rapikan role dan hak akses menjadi tabel terpadu"
          git push
