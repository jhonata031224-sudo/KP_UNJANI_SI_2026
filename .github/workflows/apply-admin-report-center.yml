name: Apply Admin Report Center UI

on:
  push:
    branches: [refactor-fokus-laporan]
    paths:
      - '.github/workflows/apply-admin-report-center.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'feat(admin): wire report center into dashboard' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-fokus-laporan
          fetch-depth: 0

      - name: Wire routes and dashboard partial
        shell: python
        run: |
          from pathlib import Path

          routes = Path('routes/web.php')
          text = routes.read_text()
          anchor = "    Route::get('/laporan', [ReportController::class, 'index'])->name('laporan.index');"
          additions = "\n    Route::get('/laporan/report-center/pengguna', [\\App\\Http\\Controllers\\Admin\\ReportCenterController::class, 'users'])->name('laporan.report-center.users');\n    Route::get('/laporan/report-center/aktivitas', [\\App\\Http\\Controllers\\Admin\\ReportCenterController::class, 'activities'])->name('laporan.report-center.activities');"
          if 'laporan.report-center.users' not in text:
              if anchor not in text:
                  raise SystemExit('Route anchor not found')
              text = text.replace(anchor, anchor + additions, 1)
              routes.write_text(text)

          view = Path('resources/views/siberad/dashboards/admin.blade.php')
          html = view.read_text()
          include_line = "@include('siberad.dashboards.partials.admin-report-center')\n"
          if include_line not in html:
              marker = '</body>'
              if marker not in html:
                  raise SystemExit('Admin view body marker not found')
              html = html.replace(marker, include_line + marker, 1)
              view.write_text(html)

      - name: Validate files
        run: |
          php -l app/Http/Controllers/Admin/ReportCenterController.php
          php artisan route:list --path=admin/laporan/report-center

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/web.php resources/views/siberad/dashboards/admin.blade.php
          if git diff --cached --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git commit -m "feat(admin): wire report center into dashboard"
          git push origin HEAD:refactor-fokus-laporan
